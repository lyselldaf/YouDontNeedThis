<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- You Don't Need This logo: a quest flask in a bag slot, marked red with an X, like the addon does in game. -->
  <defs>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2924"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d58a"/>
      <stop offset="0.5" stop-color="#b8892f"/>
      <stop offset="1" stop-color="#6e4f17"/>
    </linearGradient>
    <radialGradient id="potion" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#b6e86a"/>
      <stop offset="0.55" stop-color="#5f9e2c"/>
      <stop offset="1" stop-color="#2c5212"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe3e6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9fb8bd" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58d55"/>
      <stop offset="1" stop-color="#7a4c22"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4f"/>
      <stop offset="1" stop-color="#c3121a"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="30" y="30" width="340" height="340" rx="40"/>
    </clipPath>
  </defs>

  <!-- bag slot -->
  <rect x="16" y="16" width="368" height="368" rx="52" fill="url(#rim)"/>
  <rect x="30" y="30" width="340" height="340" rx="40" fill="url(#slot)"/>

  <g clip-path="url(#inner)">
    <!-- flask -->
    <ellipse cx="200" cy="338" rx="110" ry="16" fill="#000" opacity="0.45"/>
    <rect x="170" y="112" width="60" height="80" rx="8" fill="url(#glass)" stroke="#e8f2f3" stroke-opacity="0.6" stroke-width="5"/>
    <circle cx="200" cy="250" r="96" fill="url(#potion)" stroke="#e8f2f3" stroke-opacity="0.6" stroke-width="6"/>
    <rect x="170" y="150" width="60" height="44" fill="#5f9e2c"/>
    <path d="M128 222 A80 80 0 0 1 172 168" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
    <circle cx="232" cy="284" r="9" fill="#e8ffd0" opacity="0.6"/>
    <circle cx="206" cy="304" r="6" fill="#e8ffd0" opacity="0.5"/>
    <circle cx="250" cy="250" r="5" fill="#e8ffd0" opacity="0.5"/>
    <rect x="160" y="80" width="80" height="42" rx="10" fill="url(#cork)" stroke="#4a2c10" stroke-width="4"/>

    <!-- red "not needed" tint -->
    <rect x="30" y="30" width="340" height="340" fill="#ff1a1a" opacity="0.26"/>
  </g>

  <!-- red X -->
  <g stroke-linecap="round">
    <path d="M232 58 L342 168 M342 58 L232 168" stroke="#2a0606" stroke-width="58"/>
    <path d="M232 58 L342 168 M342 58 L232 168" stroke="url(#cross)" stroke-width="38"/>
    <path d="M238 62 L282 106 M336 62 L314 84" stroke="#ffb3ad" stroke-opacity="0.55" stroke-width="10"/>
  </g>
</svg>
